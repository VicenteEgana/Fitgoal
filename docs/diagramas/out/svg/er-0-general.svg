 y="290" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#c58a12" stroke-width="2"/><text x="378" y="305.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#6b4a05">user_plans</text><text x="378" y="323.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Rutina del participante · 15 col.</text><rect x="640" y="290" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#c58a12" stroke-width="2"/><text x="652" y="305.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#6b4a05">user_plan_exercises</text><text x="652" y="323.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Ejercicio de la rutina · 5 col.</text><rect x="640" y="130" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="652" y="145.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">routine_templates</text><text x="652" y="163.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Plantilla de rutina · 22 col.</text><rect x="640" y="410" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="652" y="425.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">rule_versions</text><text x="652" y="443.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Versión de reglas · 11 col.</text><rect x="366" y="410" width="230" height="46" rx="9" ry="9" fill="#fff" stroke="#c58a12" stroke-width="2"/><text x="378" y="425.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#6b4a05">meal_plan_swaps</text><text x="378" y="443.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Cambio de alimento · 7 col.</text><rect x="946" y="130" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="958" y="145.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">exercises</text><text x="958" y="163.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Ejercicio · 16 col.</text><rect x="946" y="230" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="958" y="245.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">template_exercises</text><text x="958" y="263.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Ejercicio de plantilla · 5 col.</text><rect x="946" y="330" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="958" y="345.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">foods</text><text x="958" y="363.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Alimento · 17 col.</text><rect x="1206" y="130" width="240" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="1218" y="145.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">meal_plan_templates</text><text x="1218" y="163.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Pauta de alimentación · 13 col.</text><rect x="1206" y="230" width="240" height="46" rx="9" ry="9" fill="#fff" stroke="#2f8a4f" stroke-width="2"/><text x="1218" y="245.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#1a5530">meal_plan_items</text><text x="1218" y="263.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Alimento de la pauta · 6 col.</text><rect x="366" y="620" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#7a4cb8" stroke-width="2"/><text x="378" y="635.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#47267a">training_sessions</text><text x="378" y="653.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Sesión de entrenamiento · 10 col.</text><rect x="640" y="620" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#7a4cb8" stroke-width="2"/><text x="652" y="635.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#47267a">weight_records</text><text x="652" y="653.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Registro de peso · 5 col.</text><rect x="914" y="620" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#7a4cb8" stroke-width="2"/><text x="926" y="635.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#47267a">notifications</text><text x="926" y="653.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Aviso interno · 7 col.</text><rect x="1188" y="620" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#7a4cb8" stroke-width="2"/><text x="1200" y="635.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#47267a">audit_log</text><text x="1200" y="653.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Auditoría · 9 col.</text><rect x="1188" y="680" width="214" height="46" rx="9" ry="9" fill="#fff" stroke="#7a4cb8" stroke-width="2"/><text x="1200" y="695.0" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#47267a">usage_events</text><text x="1200" y="713.0" text-anchor="start" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Evento de uso seudonimizado · 4 col.</text><text x="30" y="24.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b2733">ER 0 · Vista general del modelo de datos</text><text x="30" y="46.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#4a5b6c">20 tablas en 4 módulos. Las flechas muestran el flujo: catálogo aprobado → rutina del participante → sesiones; las claves hacia users se resumen en la nota lateral.</text><text x="30" y="647.3" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Casi todas las tablas referencian a users</text><text x="30" y="662.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">(línea punteada): titular de los datos,</text><text x="30" y="676.6" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">autor o aprobador. No se dibujan una a una</text><text x="30" y="691.2" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">para no saturar la vista; el detalle está en</text><text x="30" y="705.9" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">las vistas ER 1 a ER 4.</text><text x="946" y="447.3" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Claves foráneas compuestas: la base de datos verifica el rol del</text><text x="946" y="462.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">aprobador y que el perfil y las sesiones pertenezcan al mismo</text><text x="946" y="476.6" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">participante de la rutina.</text><text x="366" y="780.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">usage_events no referencia a users: se vincula por seudónimo (HMAC) para mantener separada la identidad.</text></svg>