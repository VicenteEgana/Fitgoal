<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="700" viewBox="0 0 1460 700" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img"><title>ST 1 Estados del catálogo y de la rutina</title><desc>Máquinas de estados del contenido del catálogo y de la rutina del participante</desc><defs><marker id="m-fill-52616f" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 Z" fill="#52616f" stroke="#52616f" stroke-linejoin="round"/></marker></defs><rect width="1460" height="700" fill="#ffffff"/><rect x="60" y="80" width="1340" height="270" rx="14" ry="14" fill="#fcfdfe" stroke="#d5dde5" stroke-width="1.6"/><text x="78" y="100.0" text-anchor="start" dominant-baseline="central" font-size="14.5" font-weight="700" fill="#1b2733">Contenido del catálogo: ejercicios, rutinas y reglas (status)</text><rect x="60" y="390" width="1340" height="260" rx="14" ry="14" fill="#fcfdfe" stroke="#d5dde5" stroke-width="1.6"/><text x="78" y="410.0" text-anchor="start" dominant-baseline="central" font-size="14.5" font-weight="700" fill="#1b2733">Rutina del participante (user_plans.status)</text><path d="M133,215 L265,215" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M495,200 L665,200" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M665,232 L495,232" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m-fill-52616f)"/><path d="M895,200 L1065,200" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M1295,215 L1345,215" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M131,515 L295,515" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M545,515 L770,515" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M1030,515 L1235,515" fill="none" stroke="#52616f" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><ellipse cx="120" cy="215" rx="13" ry="13" fill="#1b2733" stroke="#1b2733" stroke-width="1.6"/><rect x="265" y="175" width="230" height="80" rx="22" ry="22" fill="#fdf1d8" stroke="#c58a12" stroke-width="2.2"/><text x="380" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace" fill="#6b4a05">draft</text><text x="380" y="222.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">El profesional lo redacta; nadie</text><text x="380" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">más lo ve</text><rect x="665" y="175" width="230" height="80" rx="22" ry="22" fill="#e5f4ea" stroke="#2f8a4f" stroke-width="2.2"/><text x="780" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace" fill="#1a5530">approved</text><text x="780" y="222.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Vigente: lo ven y lo usan todas</text><text x="780" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">las personas</text><rect x="1065" y="175" width="230" height="80" rx="22" ry="22" fill="#f1f4f7" stroke="#7b8794" stroke-width="2.2"/><text x="1180" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace" fill="#3b4856">retired</text><text x="1180" y="222.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Deja de ofrecerse; lo ya iniciado</text><text x="1180" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">se conserva</text><ellipse cx="1360" cy="215" rx="15" ry="15" fill="#fff" stroke="#1b2733" stroke-width="2"/><ellipse cx="1360" cy="215" rx="8" ry="8" fill="#1b2733" stroke="#1b2733" stroke-width="1.6"/><ellipse cx="120" cy="515" rx="11" ry="11" fill="#1b2733" stroke="#1b2733" stroke-width="1.6"/><rect x="295" y="475" width="250" height="80" rx="22" ry="22" fill="#e5f4ea" stroke="#2f8a4f" stroke-width="2.2"/><text x="420" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace" fill="#1a5530">vigente</text><text x="420" y="522.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">La rutina que la persona sigue hoy;</text><text x="420" y="536.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">solo una</text><rect x="770" y="475" width="260" height="80" rx="22" ry="22" fill="#f1f4f7" stroke="#7b8794" stroke-width="2.2"/><text x="900" y="502.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" font-family="'Cascadia Mono', Consolas, monospace" fill="#3b4856">reemplazado</text><text x="900" y="522.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Se conserva en el historial; no se</text><text x="900" y="536.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">modifica</text><ellipse cx="1250" cy="515" rx="15" ry="15" fill="#fff" stroke="#1b2733" stroke-width="2"/><ellipse cx="1250" cy="515" rx="8" ry="8" fill="#1b2733" stroke="#1b2733" stroke-width="1.6"/><text x="30" y="24.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b2733">ST 1 · Diagrama de estados del contenido del catálogo y de la rutina del participante</text><text x="30" y="46.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#4a5b6c">Estados permitidos por status en exercises, routine_templates y rule_versions, y en user_plans · RF006 · las restricciones y disparadores de la base de datos impiden las transiciones no permitidas</text><text x="199" y="189.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Se crea con autor</text><text x="199" y="204.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">y versión</text><text x="580" y="162.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Aprueba el profesional</text><text x="580" y="177.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">competente</text><text x="580" y="244.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Si no cumple, se ajusta</text><text x="580" y="259.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">y sigue en draft</text><text x="980" y="162.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Se retira, o se aprueba</text><text x="980" y="177.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">una versión nueva</text><text x="730" y="292.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Una versión aprobada no se edita ni se borra: los ejercicios de una rutina aprobada quedan congelados y los cambios se publican como una versión</text><text x="730" y="307.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">nueva.</text><text x="213" y="485.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">La persona inicia una</text><text x="213" y="500.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">rutina (inmediato)</text><text x="657.5" y="485.8" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Inicia otra rutina</text><text x="657.5" y="500.2" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">(recomendada o propia)</text><text x="1132.5" y="501.0" text-anchor="middle" dominant-baseline="central" font-size="11.8" font-weight="400" fill="#1b2733" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Historial</text><text x="730" y="600.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Solo la rutina vigente programa sesiones. Al reemplazarla se quitan las sesiones futuras sin hacer y se conserva lo ya registrado.</text></svg>