<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="780" viewBox="0 0 1380 780" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img"><title>AR 0 Contexto del sistema</title><desc>FitGoal, sus usuarios y los sistemas externos con los que se relaciona</desc><defs><marker id="m-fill-52616f" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1.5 L11,6 L1,10.5 Z" fill="#52616f" stroke="#52616f" stroke-linejoin="round"/></marker><marker id="m-open-4a5b6c" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect width="1380" height="780" fill="#ffffff"/><path d="M185,186 L185.0,254.0 Q185,260 191.0,260.0 L434.0,260.0 Q440,260 440.0,266.0 L440,330" fill="none" stroke="#52616f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M465,186 L465,330" fill="none" stroke="#52616f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M745,186 L745,330" fill="none" stroke="#52616f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M1025,186 L1025.0,244.0 Q1025,250 1019.0,250.0 L946.0,250.0 Q940,250 940.0,256.0 L940,330" fill="none" stroke="#52616f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m-fill-52616f)"/><path d="M400,480 L400.0,539.0 Q400,545 394.0,545.0 L181.0,545.0 Q175,545 175.0,551.0 L175,600" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M520,480 L520.0,569.0 Q520,575 514.0,575.0 L491.0,575.0 Q485,575 485.0,581.0 L485,600" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M690,480 L690.0,554.0 Q690,560 696.0,560.0 L789.0,560.0 Q795,560 795.0,566.0 L795,600" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M900,480 L900.0,524.0 Q900,530 906.0,530.0 L1099.0,530.0 Q1105,530 1105.0,536.0 L1105,600" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M1100,396 L1050,396" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><rect x="60" y="90" width="250" height="96" rx="14" ry="14" fill="#e6effa" stroke="#2f6db5" stroke-width="2"/><text x="185" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#173f6e">Participante</text><text x="185" y="137.4" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">Adulto que inicia un plan;</text><text x="185" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">consulta su plan y registra</text><text x="185" y="166.6" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">sesiones</text><rect x="340" y="90" width="250" height="96" rx="14" ry="14" fill="#e5f4ea" stroke="#2f8a4f" stroke-width="2"/><text x="465" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1a5530">Preparador físico</text><text x="465" y="144.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">Define plantillas y revisa las</text><text x="465" y="159.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">rutinas antes de publicarlas</text><rect x="620" y="90" width="250" height="96" rx="14" ry="14" fill="#e5f4ea" stroke="#2f8a4f" stroke-width="2"/><text x="745" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1a5530">Nutricionista</text><text x="745" y="137.4" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">Aprueba alimentos, pautas de</text><text x="745" y="152.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">alimentación y reglas</text><text x="745" y="166.6" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">nutricionales</text><rect x="900" y="90" width="250" height="96" rx="14" ry="14" fill="#efe8f8" stroke="#7a4cb8" stroke-width="2"/><text x="1025" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#47267a">Administrador</text><text x="1025" y="144.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">Equipo fundador: cuentas, roles,</text><text x="1025" y="159.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#1b2733">solicitudes de datos y operación</text><rect x="330" y="330" width="720" height="150" rx="16" ry="16" fill="#fdf1d8" stroke="#c58a12" stroke-width="3"/><text x="690" y="372.0" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#6b4a05">Sistema FitGoal</text><text x="690" y="409.1" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Aplicación móvil Flutter (Android) + API REST Node.js/Express + base de datos PostgreSQL.</text><text x="690" y="425.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Recomienda rutinas aprobadas por el preparador físico, deja armar la propia y registra el</text><text x="690" y="440.9" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">seguimiento.</text><rect x="40" y="600" width="270" height="100" rx="10" ry="10" fill="#f1f4f7" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 4"/><text x="175" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b2733">Render</text><text x="175" y="654.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Aloja la API y la base de datos</text><text x="175" y="669.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">PostgreSQL gestionada del piloto</text><rect x="350" y="600" width="270" height="100" rx="10" ry="10" fill="#f1f4f7" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 4"/><text x="485" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b2733">Almacenamiento de respaldo</text><text x="485" y="654.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Destino externo y cifrado de las</text><text x="485" y="669.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">copias diarias</text><rect x="660" y="600" width="270" height="100" rx="10" ry="10" fill="#f1f4f7" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 4"/><text x="795" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b2733">GitHub</text><text x="795" y="654.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Repositorio, tablero de tareas e</text><text x="795" y="669.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">integración continua</text><rect x="970" y="600" width="270" height="100" rx="10" ry="10" fill="#f1f4f7" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 4"/><text x="1105" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b2733">Google Play</text><text x="1105" y="654.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Distribución de pruebas de la app</text><text x="1105" y="669.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">(pruebas internas)</text><rect x="1100" y="320" width="270" height="100" rx="10" ry="10" fill="#f1f4f7" stroke="#7b8794" stroke-width="1.8" stroke-dasharray="7 4"/><text x="1235" y="344.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#1b2733">Sondeo externo</text><text x="1235" y="374.7" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Consulta /health cada 5 minutos para</text><text x="1235" y="389.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">medir la disponibilidad</text><text x="30" y="24.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b2733">AR 0 · Diagrama de contexto del sistema</text><text x="30" y="46.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#4a5b6c">FitGoal con sus usuarios y los sistemas externos de los que depende (nivel 1 del modelo C4)</text><text x="185" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Registra perfil y sesiones; consulta su plan</text><text x="535" y="248.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Revisa y aprueba rutinas</text><text x="805" y="248.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Aprueba pautas</text><text x="1025" y="208.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Administra y opera</text><text x="287.5" y="535.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Se despliega en</text><text x="570" y="547.5" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Respalda hacia</text><text x="638" y="560.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Código y CI/CD</text><text x="1002.5" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">Se distribuye por</text><text x="1075" y="384.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">GET /health</text></svg>