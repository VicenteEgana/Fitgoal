<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img"><title>CU 1 Casos de uso del participante</title><desc>Casos de uso del participante y funciones del sistema incluidas</desc><defs><marker id="m-open-4a5b6c" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect width="1240" height="1300" fill="#ffffff"/><rect x="250" y="70" width="960" height="1210" rx="10" ry="10" fill="#fcfdfe" stroke="#52616f" stroke-width="1.8"/><text x="266" y="90.0" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="700" fill="#1b2733">Sistema FitGoal (app móvil + API)</text><path d="M110,650 L282,650" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,150 L282,1214" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,150 L300,150" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,226 L300,226" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,302 L300,302" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,378 L300,378" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,454 L300,454" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,530 L300,530" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,606 L300,606" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,682 L300,682" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,758 L300,758" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,834 L300,834" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,910 L300,910" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,986 L300,986" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,1062 L300,1062" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,1138 L300,1138" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M282,1214 L300,1214" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M640,302 L890,302" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M633.2828769720247,386.90633874392864 L888.43831635723,400.82390816493984" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M640,758 L885,758" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M890.1450131966468,838.5834001439634 L639.7152251669397,835.851438820003" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M1020,870 L1020,976" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M576.9077724032978,1113.1196456952325 L918.9194011078323,1033.5242121058136" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M546.9341740717487,1185.4644154352059 L943.3099682090714,1038.4450299733626" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><g stroke="#1b2733" stroke-width="2" fill="none"><circle cx="90" cy="622" r="11" fill="#fff"/><path d="M90,633 V664 M70,644 H110 M90,664 L75,690 M90,664 L105,690"/></g><text x="90" y="720.2" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#1b2733">Participante</text><text x="90" y="755.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Adulto que entrena</text><ellipse cx="470" cy="150" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="156.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Registrarse y aceptar consentimientos</text><text x="470" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-01</text><ellipse cx="470" cy="226" rx="170" ry="32" fill="#f1f4f7" stroke="#52616f" stroke-width="1.7"/><text x="470" y="232.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Iniciar y cerrar sesión</text><text x="470" y="206.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-02</text><ellipse cx="470" cy="302" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="300.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Completar y actualizar perfil y</text><text x="470" y="315.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">objetivo</text><text x="470" y="282.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-03</text><ellipse cx="470" cy="378" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="376.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Ver las rutinas recomendadas para mi</text><text x="470" y="391.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">perfil</text><text x="470" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-04</text><ellipse cx="470" cy="454" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="460.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Explorar todas las rutinas aprobadas</text><text x="470" y="434.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-05</text><ellipse cx="470" cy="530" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="536.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Empezar una rutina recomendada</text><text x="470" y="510.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-06</text><ellipse cx="470" cy="606" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="604.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar mi horario semanal y la</text><text x="470" y="619.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">sesión del día</text><text x="470" y="586.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-07</text><ellipse cx="470" cy="682" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="688.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Explorar la biblioteca de ejercicios</text><text x="470" y="662.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-08</text><ellipse cx="470" cy="758" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="764.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Armar y empezar una rutina propia</text><text x="470" y="738.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-09</text><ellipse cx="470" cy="834" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="840.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Registrar sesión realizada</text><text x="470" y="814.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-10</text><ellipse cx="470" cy="910" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="916.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar progreso, racha y calendario</text><text x="470" y="890.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-11</text><ellipse cx="470" cy="986" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="992.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar avisos internos</text><text x="470" y="966.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-13</text><ellipse cx="470" cy="1062" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="1060.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Solicitar el ejercicio de derechos</text><text x="470" y="1075.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">sobre mis datos</text><text x="470" y="1042.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-14</text><ellipse cx="470" cy="1138" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="1144.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar mis calorías estimadas</text><text x="470" y="1118.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-15</text><ellipse cx="470" cy="1214" rx="170" ry="32" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="470" y="1212.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar la pauta de 7 días y cambiar</text><text x="470" y="1227.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">alimentos</text><text x="470" y="1194.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-16</text><ellipse cx="1020" cy="302" rx="130" ry="30" fill="#e6effa" stroke="#2f6db5" stroke-width="1.7"/><text x="1020" y="308.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Validar perfil</text><text x="1020" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-17</text><ellipse cx="1020" cy="408" rx="135" ry="32" fill="#e6effa" stroke="#2f6db5" stroke-width="1.7"/><text x="1020" y="414.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Recomendar rutinas aprobadas</text><text x="1020" y="388.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-18</text><ellipse cx="1020" cy="758" rx="135" ry="32" fill="#e6effa" stroke="#2f6db5" stroke-width="1.7"/><text x="1020" y="756.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Sugerir ejercicios según el</text><text x="1020" y="771.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">objetivo</text><text x="1020" y="738.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-19</text><ellipse cx="1020" cy="840" rx="130" ry="30" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1020" y="846.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Registrar peso</text><text x="1020" y="822.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-12</text><ellipse cx="1020" cy="1010" rx="140" ry="34" fill="#e6effa" stroke="#2f6db5" stroke-width="1.7"/><text x="1020" y="1008.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Verificar consentimiento y</text><text x="1020" y="1023.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">habilitación de datos</text><text x="1020" y="988.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-20</text><text x="30" y="24.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b2733">CU 1 · Casos de uso del participante</text><text x="30" y="46.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#4a5b6c">Diagrama UML de casos de uso · RF001 a RF009 · CU-02 (autenticación) es previo a todos los casos protegidos y se omite de las asociaciones</text><text x="765" y="293.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="760.8605966646273" y="384.9" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="762.5" y="749.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="764.9301191817933" y="828.2" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«extend»</text><text x="1020" y="914.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="747.9135867555651" y="1064.3" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="745.1220711404101" y="1103.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«include»</text><text x="1020" y="1087.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Funciones del sistema (incluidas) en azul. CU-12</text><text x="1020" y="1102.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">extiende a CU-10 solo si hay consentimiento de</text><text x="1020" y="1116.6" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">seguimiento y datos habilitados; CU-15 y CU-16</text><text x="1020" y="1131.2" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">ajustan las calorías solo con los consentimientos</text><text x="1020" y="1145.9" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">de datos corporales y nutricionales; sin ellos se</text><text x="1020" y="1160.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">muestran porciones de referencia. Todo lo que ve la</text><text x="1020" y="1175.2" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">persona proviene del catálogo aprobado por el</text><text x="1020" y="1189.8" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">preparador o la nutricionista (P5).</text></svg>