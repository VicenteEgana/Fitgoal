<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="900" viewBox="0 0 1620 900" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img"><title>CU 2 Casos de uso de profesionales y administración</title><desc>Casos de uso del preparador físico, la nutricionista y el administrador</desc><defs><marker id="m-open-4a5b6c" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5,1.5 L10.5,6 L1.5,10.5" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round"/></marker></defs><rect width="1620" height="900" fill="#ffffff"/><rect x="220" y="70" width="1190" height="800" rx="10" ry="10" fill="#fcfdfe" stroke="#52616f" stroke-width="1.8"/><text x="236" y="90.0" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="700" fill="#1b2733">Sistema FitGoal (app móvil + API)</text><path d="M100,270 L240,270" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M240,160 L240,420" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M240,160 L275,160" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M240,270 L275,270" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M240,420 L275,420" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M100,640 L258,640" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M258,640 L258,640" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M258,640 L275,640" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1500,440 L1380,440" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,170 L1380,770" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,170 L1340,170" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,290 L1340,290" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,410 L1340,410" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,530 L1340,530" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,650 L1340,650" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M1380,770 L1340,770" fill="none" stroke="#52616f" stroke-width="1.5" stroke-linejoin="round"/><path d="M729.2582968780481,198.8029422641284 L577.0306637601404,178.38216221172615" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><path d="M729.2582968780481,231.1970577358716 L577.0306637601404,251.61783778827385" fill="none" stroke="#4a5b6c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m-open-4a5b6c)"/><g stroke="#1b2733" stroke-width="2" fill="none"><circle cx="80" cy="242" r="11" fill="#fff"/><path d="M80,253 V284 M60,264 H100 M80,284 L65,310 M80,284 L95,310"/></g><text x="80" y="340.2" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#1b2733">Preparador</text><text x="80" y="356.7" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#1b2733">físico</text><text x="80" y="375.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Nicolás Villacura</text><g stroke="#1b2733" stroke-width="2" fill="none"><circle cx="80" cy="612" r="11" fill="#fff"/><path d="M80,623 V654 M60,634 H100 M80,654 L65,680 M80,654 L95,680"/></g><text x="80" y="710.2" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#1b2733">Nutricionista</text><g stroke="#1b2733" stroke-width="2" fill="none"><circle cx="1520" cy="412" r="11" fill="#fff"/><path d="M1520,423 V454 M1500,434 H1540 M1520,454 L1505,480 M1520,454 L1535,480"/></g><text x="1520" y="510.2" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#1b2733">Administrador</text><text x="1520" y="545.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">Operación del</text><text x="1520" y="559.0" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c">servicio</text><ellipse cx="440" cy="160" rx="165" ry="33" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="440" y="166.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Gestionar los ejercicios del catálogo</text><text x="440" y="139.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-21</text><ellipse cx="440" cy="270" rx="165" ry="33" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="440" y="276.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Gestionar las rutinas del catálogo</text><text x="440" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-22</text><ellipse cx="440" cy="420" rx="165" ry="36" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="440" y="418.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Definir y aprobar las reglas de</text><text x="440" y="433.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">recomendación</text><text x="440" y="396.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-24</text><ellipse cx="440" cy="640" rx="165" ry="36" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="440" y="638.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Gestionar y aprobar alimentos, pautas</text><text x="440" y="653.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">y reglas nutricionales</text><text x="440" y="616.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-25</text><ellipse cx="850" cy="215" rx="140" ry="32" fill="#fdf1d8" stroke="#c58a12" stroke-width="1.7"/><text x="850" y="221.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Aprobar ejercicios y rutinas</text><text x="850" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-23</text><ellipse cx="1180" cy="170" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="176.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Gestionar cuentas y roles</text><text x="1180" y="148.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-26</text><ellipse cx="1180" cy="290" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="288.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Resolver solicitudes de derechos</text><text x="1180" y="303.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">sobre datos</text><text x="1180" y="268.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-27</text><ellipse cx="1180" cy="410" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="416.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar la auditoría</text><text x="1180" y="388.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-28</text><ellipse cx="1180" cy="530" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="528.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Consultar los indicadores del</text><text x="1180" y="543.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">piloto</text><text x="1180" y="508.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-29</text><ellipse cx="1180" cy="650" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="656.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Operar respaldo y restauración</text><text x="1180" y="628.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-30</text><ellipse cx="1180" cy="770" rx="160" ry="34" fill="#fff" stroke="#52616f" stroke-width="1.7"/><text x="1180" y="768.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">Monitorear disponibilidad y atender</text><text x="1180" y="783.5" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="400" fill="#1b2733">incidentes</text><text x="1180" y="748.0" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="700" fill="#4a5b6c">CU-31</text><text x="30" y="24.0" text-anchor="start" dominant-baseline="central" font-size="20" font-weight="700" fill="#1b2733">CU 2 · Casos de uso de profesionales y administración</text><text x="30" y="46.0" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="400" fill="#4a5b6c">Diagrama UML de casos de uso · RF004 a RF010, RNF003 · el preparador define y aprueba una sola vez lo que reciben todas las personas; CU-23 extiende a CU-21 y CU-22</text><text x="653.1444803190943" y="179.6" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«extend»</text><text x="653.1444803190943" y="232.4" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#4a5b6c" style="paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round">«extend»</text><text x="830" y="567.3" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">Competencia: la base de datos solo admite que el preparador</text><text x="830" y="582.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">apruebe ejercicios, rutinas y reglas de entrenamiento, y</text><text x="830" y="596.6" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">que la nutricionista apruebe alimentos, pautas y reglas de</text><text x="830" y="611.2" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">nutrición. No existe revisión caso a caso: la persona</text><text x="830" y="625.9" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">recibe al instante lo que ya está aprobado. CU-25 queda</text><text x="830" y="640.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">bloqueado para contenido personal mientras no exista</text><text x="830" y="655.2" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#4a5b6c">nutricionista.</text></svg>